name: djym
description: "djym: a local-first gym logger."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  cupertino_icons: ^1.0.9
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqlite3: ^2.9.4
  table_calendar: ^3.3.0
  timezone: ^0.11.2
  wakelock_plus: ^1.6.1

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.31.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
